
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ride Booking</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#b7642e;
font-family: 'Poppins', sans-serif;
}

.order-box{
background:#e7f05a;
border-radius:30px;
padding:25px;
}

input,select{
width:100%;
padding:12px;
border-radius:15px;
background:#eeeeee;
}

.order-btn{
background:#e7f05a;
color:red;
font-weight:bold;
font-size:26px;
padding:10px 40px;
border-radius:25px;
margin-top:20px;
}

.order-btn:disabled{
opacity:0.6;
cursor:not-allowed;
}

.location-status{
font-size:13px;
margin-top:4px;
min-height:18px;
}

/* ── Screen lock overlay ── */
#screenLock{
display:none;
position:fixed;
inset:0;
z-index:9999;
background:rgba(0,0,0,0.45);
backdrop-filter:blur(2px);
touch-action:none;
user-select:none;
}
#screenLock .lock-card{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
border-radius:20px;
padding:28px 36px;
text-align:center;
box-shadow:0 8px 32px rgba(0,0,0,0.25);
min-width:220px;
}
#screenLock .lock-spinner{
display:inline-block;
width:36px;
height:36px;
border:4px solid rgba(0,0,0,0.12);
border-top-color:#b7642e;
border-radius:50%;
animation:lockSpin 0.7s linear infinite;
margin-bottom:14px;
}
@keyframes lockSpin{
to{transform:rotate(360deg);}
}
#screenLock .lock-text{
font-size:16px;
font-weight:700;
color:#333;
margin:0;
}
#screenLock .lock-sub{
font-size:12px;
color:#888;
margin-top:5px;
}

/* ── Button spinner ── */
.spinner{
display:inline-block;
width:20px;
height:20px;
border:3px solid rgba(255,0,0,0.3);
border-top-color:red;
border-radius:50%;
animation:lockSpin 0.7s linear infinite;
vertical-align:middle;
margin-left:8px;
}

/* ── Pickup unavailable popup ── */
#unavailablePopup{
display:none;
position:fixed;
inset:0;
z-index:9998;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(2px);
touch-action:none;
}
#unavailablePopup .popup-card{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
border-radius:20px;
padding:30px 28px;
text-align:center;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
min-width:260px;
max-width:300px;
}
#unavailablePopup .popup-icon{
font-size:42px;
margin-bottom:10px;
}
#unavailablePopup .popup-title{
font-size:17px;
font-weight:700;
color:#b7642e;
margin-bottom:8px;
}
#unavailablePopup .popup-msg{
font-size:15px;
font-weight:600;
color:#333;
margin-bottom:6px;
}
#unavailablePopup .popup-sub{
font-size:12px;
color:#888;
margin-bottom:18px;
line-height:1.5;
}
#unavailablePopup .popup-btn{
background:#b7642e;
color:white;
font-weight:700;
font-size:15px;
padding:10px 30px;
border-radius:20px;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<!-- SCREEN LOCK OVERLAY -->
<div id="screenLock">
  <div class="lock-card">
    <div class="lock-spinner"></div>
    <p class="lock-text" id="lockMessage">Booking your ride…</p>
    <p class="lock-sub">Please don't close this page</p>
  </div>
</div>

<!-- PICKUP UNAVAILABLE POPUP -->
<div id="unavailablePopup">
  <div class="popup-card">
    <div class="popup-icon">🚫</div>
    <div class="popup-title">Pickup Not Available</div>
    <div class="popup-msg">Ning jainbi — Jada dur hein!</div>
    <div class="popup-sub">We are unable to pick you up from this location as it is too far away.</div>
    <button class="popup-btn" onclick="closeUnavailablePopup()">OK, Got it</button>
  </div>
</div>

<!-- HEADER -->
<div class="w-full bg-[#F5E9D8] py-4 flex items-center justify-center relative">
<img src="startup.png" class="absolute left-4 w-10 md:w-14">
<h1 class="text-3xl md:text-5xl font-bold text-black">
AN SERVICES
</h1>
</div>

<!-- PAGE CONTAINER -->
<div class="max-w-md mx-auto px-5 py-10">

<!-- TITLE -->
<div class="flex items-center justify-center mb-6">
<div class="bg-[#e7f05a] p-3 rounded-xl shadow mr-3">
<img src="ride.png" class="w-8">
</div>
<h2 class="text-3xl font-bold bg-[#e7f05a] px-6 py-2 rounded-full">
Book your ride buddy
</h2>
</div>

<!-- BOOKING BOX -->
<div class="order-box space-y-3">

<input id="name" placeholder="Name">

<select id="pickup" onchange="onPickupChange()">
  <option value="">Pick up location</option>
  <option>Purna Bazar</option>
  <option>Shivraipur 2</option>
  <option>Shivraipur</option>
  <option>Gangdangbra</option>
  <option>Gumberling</option>
  <option>Hasin-1</option>
  <option>Hasin-2</option>
  <option>Nutun Haza</option>
  <option>Tenali</option>
  <option>Sengol</option>
</select>

<select id="drop" onchange="calculateFare()">
  <option value="">Drop location</option>
  <option>Purna Bazar</option>
  <option>Shivraipur 2</option>
  <option>Shivraipur</option>
  <option>Gangdangbra</option>
  <option>Gumberling</option>
  <option>Hasin-1</option>
  <option>Hasin-2</option>
  <option>Nutun Haza</option>
  <option>Tenali</option>
  <option>Sengol</option>
</select>

<!-- FARE DISPLAY -->
<div class="text-xl font-semibold text-center">
Fare: ₹ <span id="fare">0</span>
</div>

<input id="phone" placeholder="Phone Number">

<input id="location" placeholder="Your location">

<div id="locationStatus" class="location-status text-gray-600"></div>

<button onclick="getLocation()" id="locationBtn" class="underline text-sm">
Use my current location
</button>

</div>

<div class="text-center">
<button onclick="bookRide()" id="orderBtn" class="order-btn">
Book Ride
</button>
</div>

</div>

<!-- CALL BUTTON -->
<div class="text-center pb-8">
  <a href="tel:+916000072131"
    class="inline-flex items-center gap-2 bg-[#F5E9D8] text-black font-bold text-lg px-6 py-3 rounded-full shadow-md active:scale-95 transition-transform">
    📞 Call Us
  </a>
</div>

<script>

/* ─────────────────────────────────────────────────────
   ✏️  PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
───────────────────────────────────────────────────── */
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBuHRrR0uoUUYsYzaGdABeoydZqaZ1J0fCSsr8GyTb63UESaiKes9e6hOcjcWRDqJ7Zg/exec";   /* ← PASTE HERE */

/* ─────────────────────────────────────────────────────
   ✏️  PASTE YOUR TELEGRAM BOT TOKEN HERE
───────────────────────────────────────────────────── */
const TELEGRAM_BOT_TOKEN = "8749146601:AAH1VBmlxjkQw6amiBn9vYQXoZFtZsuzy98";  /* ← PASTE HERE */

/* ─────────────────────────────────────────────────────
   ✏️  PASTE YOUR TELEGRAM CHAT ID HERE
───────────────────────────────────────────────────── */
const TELEGRAM_CHAT_ID = "6012626075";    /* ← PASTE HERE */


/* ─────────────────────────────────────────────────────
   VALID PICKUP LOCATIONS
   Nutun Haza and Tenali are NOT listed here →
   selecting them shows "Ning jainbi / Jada dur hein"
───────────────────────────────────────────────────── */
const validPickups = [
  "Purna Bazar",
  "Shivraipur 2",
  "Shivraipur",
  "Gangdangbra",
  "Gumberling",
  "Hasin-1",
  "Hasin-2",
  "Sengol"
];


/* ─────────────────────────────────────────────────────
   FARE TABLE — both directions handled automatically
───────────────────────────────────────────────────── */
const fares = {

  /* 1 — Purna Bazar */
  "Purna Bazar-Shivraipur 2" : 20,
  "Purna Bazar-Shivraipur"   : 30,
  "Purna Bazar-Gangdangbra"  : 30,
  "Purna Bazar-Gumberling"   : 30,
  "Purna Bazar-Hasin-1"      : 30,
  "Purna Bazar-Hasin-2"      : 30,
  "Purna Bazar-Nutun Haza"   : 40,
  "Purna Bazar-Tenali"       : 50,
  "Purna Bazar-Sengol"       : 30,

  /* 2 — Shivraipur 2 */
  "Shivraipur 2-Shivraipur"  : 30,
  "Shivraipur 2-Gangdangbra" : 30,
  "Shivraipur 2-Gumberling"  : 30,
  "Shivraipur 2-Hasin-1"     : 20,
  "Shivraipur 2-Hasin-2"     : 30,
  "Shivraipur 2-Nutun Haza"  : 40,
  "Shivraipur 2-Tenali"      : 50,
  "Shivraipur 2-Sengol"      : 30,

  /* 3 — Shivraipur */
  "Shivraipur-Gangdangbra"   : 30,
  "Shivraipur-Gumberling"    : 30,
  "Shivraipur-Hasin-1"       : 20,
  "Shivraipur-Hasin-2"       : 30,
  "Shivraipur-Nutun Haza"    : 40,
  "Shivraipur-Tenali"        : 50,
  "Shivraipur-Sengol"        : 30,

  /* 4 — Gangdangbra */
  "Gangdangbra-Gumberling"   : 30,
  "Gangdangbra-Hasin-1"      : 20,
  "Gangdangbra-Hasin-2"      : 30,
  "Gangdangbra-Nutun Haza"   : 30,
  "Gangdangbra-Tenali"       : 40,
  "Gangdangbra-Sengol"       : 30,

  /* 5 — Gumberling */
  "Gumberling-Hasin-1"       : 20,
  "Gumberling-Hasin-2"       : 10,
  "Gumberling-Nutun Haza"    : 50,
  "Gumberling-Tenali"        : 60,
  "Gumberling-Sengol"        : 40,

  /* 6 — Hasin-1 */
  "Hasin-1-Hasin-2"          : 10,
  "Hasin-1-Nutun Haza"       : 40,
  "Hasin-1-Tenali"           : 50,
  "Hasin-1-Sengol"           : 30,

  /* 7 — Hasin-2 */
  "Hasin-2-Nutun Haza"       : 50,
  "Hasin-2-Tenali"           : 40,
  "Hasin-2-Sengol"           : 40,

  /* 8 — Sengol */
  "Sengol-Tenali"            : 60,

};


/* ══════════════════════════════════════════════════════
   PICKUP CHANGE — validate before calculating fare
══════════════════════════════════════════════════════ */

function onPickupChange(){

  const pickup = document.getElementById("pickup").value;

  if(pickup === ""){ return; }

  if(!validPickups.includes(pickup)){
    showUnavailablePopup();
    document.getElementById("pickup").value   = "";
    document.getElementById("fare").innerText = "0";
    return;
  }

  calculateFare();

}


/* ══════════════════════════════════════════════════════
   UNAVAILABLE POPUP CONTROLS
══════════════════════════════════════════════════════ */

function showUnavailablePopup(){
  document.getElementById("unavailablePopup").style.display = "block";
  document.body.style.overflow = "hidden";
}

function closeUnavailablePopup(){
  document.getElementById("unavailablePopup").style.display = "none";
  document.body.style.overflow = "";
  document.getElementById("pickup").focus();
}


/* ══════════════════════════════════════════════════════
   FARE CALCULATION
══════════════════════════════════════════════════════ */

function calculateFare(){

  const pickup = document.getElementById("pickup").value;
  const drop   = document.getElementById("drop").value;

  if(pickup !== "" && drop !== "" && pickup === drop){
    alert("Pickup and drop location cannot be the same.");
    document.getElementById("drop").value    = "";
    document.getElementById("fare").innerText = "0";
    return;
  }

  const key        = pickup + "-" + drop;
  const reverseKey = drop   + "-" + pickup;

  if(fares[key]){
    document.getElementById("fare").innerText = fares[key];
  } else if(fares[reverseKey]){
    document.getElementById("fare").innerText = fares[reverseKey];
  } else {
    document.getElementById("fare").innerText = "0";
  }

}


/* ══════════════════════════════════════════════════════
   LOCATION
══════════════════════════════════════════════════════ */

let locationWatcher = null;

function getLocation(){

  if(!confirm("Allow access to your current location?")){ return; }

  const statusEl   = document.getElementById("locationStatus");
  const locationEl = document.getElementById("location");
  const btn        = document.getElementById("locationBtn");

  statusEl.textContent = "📍 Fetching your location…";
  btn.disabled         = true;

  if(locationWatcher !== null){
    navigator.geolocation.clearWatch(locationWatcher);
    locationWatcher = null;
  }

  if(!navigator.geolocation){
    statusEl.textContent = "❌ Geolocation not supported on this device.";
    btn.disabled         = false;
    return;
  }

  const opts = { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 };

  locationWatcher = navigator.geolocation.watchPosition(
    function(pos){
      locationEl.value     = pos.coords.latitude + "," + pos.coords.longitude;
      statusEl.textContent = "✅ Location fetched!";
      btn.disabled         = false;
    },
    function(){
      statusEl.textContent = "❌ Unable to get location. Please allow permission.";
      btn.disabled         = false;
    },
    opts
  );

}


/* ══════════════════════════════════════════════════════
   VALIDATION
══════════════════════════════════════════════════════ */

function validateOrder(){

  const name     = document.getElementById("name").value.trim();
  const pickup   = document.getElementById("pickup").value.trim();
  const drop     = document.getElementById("drop").value.trim();
  const fare     = document.getElementById("fare").innerText.trim();
  const phone    = document.getElementById("phone").value.trim();
  const location = document.getElementById("location").value.trim();

  if(name === ""){
    alert("Name is required.");
    document.getElementById("name").focus();
    return false;
  }
  if(pickup === ""){
    alert("Please select a pickup location.");
    document.getElementById("pickup").focus();
    return false;
  }
  if(!validPickups.includes(pickup)){
    showUnavailablePopup();
    document.getElementById("pickup").value = "";
    return false;
  }
  if(drop === ""){
    alert("Please select a drop location.");
    document.getElementById("drop").focus();
    return false;
  }
  if(pickup === drop){
    alert("Pickup and drop location cannot be the same.");
    document.getElementById("drop").focus();
    return false;
  }
  if(fare === "0" || fare === ""){
    alert("No fare available for this route. Please select a valid pickup and drop.");
    return false;
  }
  if(phone === ""){
    alert("Phone number is required.");
    document.getElementById("phone").focus();
    return false;
  }
  if(location === ""){
    alert("Your location is required. Enter it manually or use 'Use my current location'.");
    document.getElementById("location").focus();
    return false;
  }

  return true;

}


/* ══════════════════════════════════════════════════════
   SCREEN LOCK + BUTTON SPINNER
══════════════════════════════════════════════════════ */

function setOrderLoading(loading){

  const overlay = document.getElementById("screenLock");
  const btn     = document.getElementById("orderBtn");

  if(loading){
    overlay.style.display             = "block";
    document.body.style.overflow      = "hidden";
    document.body.style.pointerEvents = "none";
    overlay.style.pointerEvents       = "all";
    btn.disabled  = true;
    btn.innerHTML = 'Booking… <span class="spinner"></span>';
  } else {
    overlay.style.display             = "none";
    document.body.style.overflow      = "";
    document.body.style.pointerEvents = "";
    btn.disabled  = false;
    btn.innerHTML = "Book Ride";
  }

}


/* ══════════════════════════════════════════════════════
   BOOK RIDE
══════════════════════════════════════════════════════ */

async function bookRide(){

  if(!validateOrder()){ return; }

  const name     = document.getElementById("name").value.trim();
  const pickup   = document.getElementById("pickup").value.trim();
  const drop     = document.getElementById("drop").value.trim();
  const fare     = document.getElementById("fare").innerText.trim();
  const phone    = document.getElementById("phone").value.trim();
  const location = document.getElementById("location").value.trim();

  setOrderLoading(true);

  const mapsLink = location.includes(",")
    ? "https://maps.google.com/?q=" + location
    : location;

  const message =
`🚗 NEW RIDE BOOKING

👤 Name: ${name}

📍 Pickup: ${pickup}
🏁 Drop: ${drop}

💰 Fare: ₹${fare}

📞 Phone: ${phone}

📍 Live Location:
${mapsLink}`;

  let telegramOk = true;
  let sheetsOk   = true;

  /* ── Google Sheets ── */
  if(GOOGLE_SCRIPT_URL !== ""){
    try{
      await fetch(GOOGLE_SCRIPT_URL, {
        method : "POST",
        mode   : "no-cors",
        body   : JSON.stringify({
          service  : "ride",
          name     : name,
          pickup   : pickup,
          drop     : drop,
          fare     : fare,
          phone    : phone,
          location : location
        })
      });
    } catch(e){
      console.error("Sheets error:", e);
      sheetsOk = false;
    }
  }

  /* ── Telegram ── */
  try{
    const tRes  = await fetch(
      `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,
      {
        method  : "POST",
        headers : { "Content-Type": "application/json" },
        body    : JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message })
      }
    );
    const tData = await tRes.json();
    if(!tData.ok){ telegramOk = false; }
  } catch(e){
    console.error("Telegram error:", e);
    telegramOk = false;
  }

  setOrderLoading(false);

  if(!telegramOk && TELEGRAM_BOT_TOKEN !== ""){
    alert("❌ Failed to send booking via Telegram. Please check your connection and try again.");
    return;
  }
  if(!sheetsOk){
    alert("⚠️ Booking sent via Telegram but failed to save to Google Sheets. Please inform the admin.");
  } else {
    alert("✅ Ride booked successfully!");
  }

  /* ── Reset ── */
  document.getElementById("name").value                 = "";
  document.getElementById("pickup").value               = "";
  document.getElementById("drop").value                 = "";
  document.getElementById("fare").innerText             = "0";
  document.getElementById("phone").value                = "";
  document.getElementById("location").value             = "";
  document.getElementById("locationStatus").textContent = "";

}

</script>

</body>
</html>
